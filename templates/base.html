<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>{% block title %}WorkNOW{% endblock %}</title>
       <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
        <!-- Core theme CSS (includes Bootstrap)-->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
    </head>

    <body id="page-top">
        <!-- NAV BAR-->
       <header class="header-worknow p-3">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">

            <!-- Logo -->
            <img src="{{ url_for('static', filename='img/logo_3.png') }}" alt="WorkNOW Logo" class="header-logo">

            <!-- Menu de navegação -->
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                <li><a href="#" class="nav-link px-2 link-work">Início</a></li>
                <li><a href="#" class="nav-link px-2 link-work">Serviços</a></li>
                <li><a href="#" class="nav-link px-2 link-work">Profissionais</a></li>
                <li><a href="#" class="nav-link px-2 link-work">Sobre nós</a></li>
            </ul>

            <!-- Botões -->
            <div class="text-end">
                <button type="button" class="btn btn-login me-2">
                    Login
                </button>

                <button type="button" class="btn btn-cadastrar">
                    Cadastrar
                </button>
            </div>

        </div>
    </div>
</header>

        <!-- Conteudo especifico -->
         {% block content %}
         {% endblock %}
        

        <!-- Footer-->
<footer class="footer-worknow">
    <div class="container">
        <div class="footer-conteudo">

            <div>
                <img class="logo-footer" src="{{ url_for('static', filename='img/logo_2.png') }}" alt="logo_2">
            </div>

            <div>
                <h4>Links</h4>
                <a href="#">Início</a>
                <a href="#">Serviços</a>
                <a href="#">Profissionais</a>
                <a href="#">Sobre</a>
            </div>

            <div>
                <h4>Contato</h4>
                <a href="#">Fale conosco</a>
                <a href="#">WhatsApp</a>
            </div>

        </div>

        <hr>

        <p class="copyright">
            WorkNOW © 2026 - Todos os direitos reservados.
        </p>

    </div>

</footer>

        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
